name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # native TypeScript stripping for `node --test test/*.test.ts`
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run security:check
      - run: npm test
      - run: npm run pack:check

  host-compatibility:
    name: Pi ${{ matrix.pi }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.85.1", "0.86.1", "0.87.1", "0.99.2", "1.0.0", "1.1.0", "1.3.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm pkg set 'devDependencies.@earendil-works/pi-coding-agent=${{ matrix.pi }}' 'devDependencies.@earendil-works/pi-ai=${{ matrix.pi }}'
      # Native 1.x packages use ^ ranges although their internal APIs move together.
      # Pin the synthetic host family so a 1.1 host cannot load 1.3 codemode/MCP.
      - if: startsWith(matrix.pi, '1.')
        run: |
          for package in chord pi-agent-core pi-tui pi-codemode pi-mcp; do
            npm pkg set "overrides.@earendil-works/$package=${{ matrix.pi }}"
          done
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm ls --all
      - run: npm run check
      - run: npm test
